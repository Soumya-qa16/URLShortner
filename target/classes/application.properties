spring.application.name=urlshortener

# Database Configuration (H2 for local testing, replace with Postgres for production)
spring.datasource.url=jdbc:h2:mem:urldb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=Test101!
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Redis Configuration 
spring.data.redis.host=local host
spring.data.redis.port=6379

# Base URL settings
app.base-url=http://localhost:8080/